<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Netflix Maker</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial, sans-serif;
}

.top{
  height:64px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 28px;
  background:#000;
  border-bottom:1px solid #222;
}

.logo{
  color:#e50914;
  font-size:28px;
  font-weight:900;
}

.top-buttons{
  display:flex;
  gap:10px;
}

button{
  background:#e50914;
  color:white;
  border:0;
  padding:12px 18px;
  border-radius:4px;
  font-weight:700;
  cursor:pointer;
}

button.secondary{
  background:#333;
}

.wrap{
  display:grid;
  grid-template-columns:360px 1fr;
  height:calc(100vh - 64px);
}

.panel{
  padding:24px;
  background:#181818;
  border-right:1px solid #333;
  overflow:auto;
}

label{
  display:block;
  margin-top:16px;
  font-size:13px;
  color:#bbb;
}

input, textarea{
  width:100%;
  margin-top:6px;
  padding:11px;
  background:#222;
  border:1px solid #444;
  color:white;
  border-radius:4px;
}

textarea{
  height:90px;
  resize:none;
}

.preview-area{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
}

.netflix-screen{
  width:960px;
  height:540px;
  position:relative;
  overflow:hidden;
  background:#000;
  border-radius:10px;
  box-shadow:0 20px 80px rgba(0,0,0,.7);
}

.bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center top;
  opacity:.78;
}

.gradient{
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,#000 0%,rgba(0,0,0,.86) 36%,rgba(0,0,0,.28) 70%,rgba(0,0,0,.05) 100%),
    linear-gradient(0deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 42%);
}

.content{
  position:absolute;
  left:60px;
  top:76px;
  width:620px;
}

.netflix-mini{
  color:#e50914;
  font-size:22px;
  font-weight:900;
  margin-bottom:18px;
}

.title{
  width:620px;
  max-height:155px;
  font-size:72px;
  font-weight:900;
  line-height:1.12;
  margin-bottom:18px;
  overflow:hidden;
  word-break:keep-all;
  letter-spacing:-2px;
  padding-bottom:8px;
}

.meta{
  width:560px;
  color:#ccc;
  font-size:18px;
  margin-bottom:18px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.desc{
  width:560px;
  max-height:115px;
  color:#eee;
  font-size:19px;
  line-height:1.45;
  margin-bottom:26px;
  overflow:hidden;
  word-break:keep-all;
}

.play{
  display:inline-block;
  background:white;
  color:black;
  padding:13px 28px;
  border-radius:4px;
  font-size:18px;
  font-weight:900;
  max-width:240px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  cursor:pointer;
}

.status{
  margin-top:14px;
  font-size:13px;
  color:#aaa;
  line-height:1.5;
}

.hidden{
  width:0;
  height:0;
  overflow:hidden;
}
</style>
</head>

<body>

<div class="top">
  <div class="logo">NETFLIX MAKER</div>

  <div class="top-buttons">
    <button class="secondary" onclick="toggleMusic()">음악 재생</button>
    <button class="secondary" onclick="saveVideo()">WEBM 영상 저장</button>
    <button onclick="savePNG()">완성 PNG 저장</button>
  </div>
</div>

<div class="wrap">
  <div class="panel">
    <label>배경 이미지 업로드</label>
    <input type="file" id="imageInput" accept="image/*">

    <label>작품 제목</label>
    <input id="titleInput" value="토마토 아이스 클럽">

    <label>상단 라벨</label>
    <input id="labelInput" value="NETFLIX ORIGINAL">

    <label>정보</label>
    <input id="metaInput" value="2026 · 블랙코미디 · SF 다큐멘터리">

    <label>소개 문구</label>
    <textarea id="descInput">사막 한복판의 냉각 리조트. 손님들은 완벽한 휴식을 위해 이곳에 도착하지만, 곧 이 유토피아의 이상한 규칙을 마주한다.</textarea>

    <label>버튼 문구</label>
    <input id="buttonInput" value="▶ 재생">

    <label>유튜브 링크 또는 ID</label>
    <input id="youtubeInput" placeholder="https://youtu.be/xxxxx">

    <label>MP3 / 오디오 파일 업로드</label>
    <input type="file" id="audioInput" accept="audio/*">

    <label>영상 저장 길이 초</label>
    <input id="durationInput" type="number" value="8" min="1" max="60">

    <div class="status" id="status">
      유튜브는 사이트에서 재생 가능. 영상 저장에 소리까지 넣으려면 MP3 업로드를 사용해야 함.
    </div>
  </div>

  <div class="preview-area">
    <div class="netflix-screen" id="capture">
      <div class="bg" id="bg"></div>
      <div class="gradient"></div>

      <div class="content">
        <div class="netflix-mini" id="labelText">NETFLIX ORIGINAL</div>
        <div class="title" id="titleText">토마토 아이스 클럽</div>
        <div class="meta" id="metaText">2026 · 블랙코미디 · SF 다큐멘터리</div>
        <div class="desc" id="descText">사막 한복판의 냉각 리조트. 손님들은 완벽한 휴식을 위해 이곳에 도착하지만, 곧 이 유토피아의 이상한 규칙을 마주한다.</div>
        <div class="play" id="buttonText" onclick="toggleMusic()">▶ 재생</div>
      </div>
    </div>
  </div>
</div>

<div class="hidden" id="youtubeBox"></div>
<audio id="audioPlayer"></audio>

<script>
const $ = id => document.getElementById(id);

let audioFileURL = "";
let isPlaying = false;

function fitText(el, maxSize, minSize){
  el.style.fontSize = maxSize + "px";

  let size = maxSize;

  while(
    (el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) &&
    size > minSize
  ){
    size -= 1;
    el.style.fontSize = size + "px";
  }
}

function updateAll(){
  $("titleText").innerText = $("titleInput").value;
  $("labelText").innerText = $("labelInput").value;
  $("metaText").innerText = $("metaInput").value;
  $("descText").innerText = $("descInput").value;
  $("buttonText").innerText = $("buttonInput").value;

  requestAnimationFrame(()=>{
    fitText($("titleText"), 72, 44);
    fitText($("descText"), 19, 13);
  });
}

["titleInput","labelInput","metaInput","descInput","buttonInput"].forEach(id=>{
  $(id).oninput = updateAll;
});

$("imageInput").onchange = e => {
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    $("bg").style.backgroundImage = `url(${reader.result})`;
  };
  reader.readAsDataURL(file);
};

$("audioInput").onchange = e => {
  const file = e.target.files[0];
  if(!file) return;

  if(audioFileURL){
    URL.revokeObjectURL(audioFileURL);
  }

  audioFileURL = URL.createObjectURL(file);
  $("audioPlayer").src = audioFileURL;
  $("status").innerText = "오디오 파일이 등록됨. 재생 및 WEBM 영상 저장 시 소리 포함 가능.";
};

function getYoutubeId(url){
  if(!url) return "";

  if(url.includes("youtube.com/watch?v=")){
    return url.split("v=")[1].split("&")[0];
  }

  if(url.includes("youtu.be/")){
    return url.split("youtu.be/")[1].split("?")[0];
  }

  return url.trim();
}

function loadYoutube(){
  const id = getYoutubeId($("youtubeInput").value);
  if(!id) return false;

  $("youtubeBox").innerHTML = `
    <iframe
      id="yt"
      width="1"
      height="1"
      src="https://www.youtube.com/embed/${id}?enablejsapi=1&origin=${location.origin}"
      allow="autoplay"
    ></iframe>
  `;

  return true;
}

function playYoutube(){
  const iframe = document.getElementById("yt");

  if(!iframe){
    if(!loadYoutube()) return;
    setTimeout(playYoutube, 500);
    return;
  }

  iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
}

function pauseYoutube(){
  const iframe = document.getElementById("yt");
  if(!iframe) return;

  iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
}

function toggleMusic(){
  const audio = $("audioPlayer");
  const hasAudio = audioFileURL;
  const hasYoutube = $("youtubeInput").value.trim();

  if(!hasAudio && !hasYoutube){
    $("status").innerText = "MP3 파일 또는 유튜브 링크를 먼저 넣어줘.";
    return;
  }

  if(!isPlaying){
    if(hasAudio){
      audio.currentTime = 0;
      audio.play();
      $("status").innerText = "MP3 재생 중.";
    }else{
      playYoutube();
      $("status").innerText = "유튜브 재생 중. 단, WEBM 저장에는 유튜브 소리가 포함되지 않을 수 있음.";
    }

    isPlaying = true;
    $("buttonText").innerText = "Ⅱ 일시정지";
  }else{
    audio.pause();
    pauseYoutube();

    isPlaying = false;
    $("buttonText").innerText = $("buttonInput").value;
    $("status").innerText = "음악 일시정지.";
  }
}

function savePNG(){
  document.fonts.ready.then(()=>{
    updateAll();

    setTimeout(()=>{
      html2canvas($("capture"),{
        backgroundColor:null,
        scale:3,
        useCORS:true,
        logging:false,
        scrollX:0,
        scrollY:0
      }).then(canvas=>{
        const link=document.createElement("a");
        link.download="netflix-maker.png";
        link.href=canvas.toDataURL("image/png");
        link.click();
      });
    },120);
  });
}

async function saveVideo(){
  const duration = Math.max(1, Number($("durationInput").value || 8));
  const capture = $("capture");
  const audio = $("audioPlayer");

  $("status").innerText = "영상 저장 준비 중...";

  const canvas = await html2canvas(capture,{
    backgroundColor:null,
    scale:2,
    useCORS:true,
    logging:false,
    scrollX:0,
    scrollY:0
  });

  const videoCanvas = document.createElement("canvas");
  videoCanvas.width = canvas.width;
  videoCanvas.height = canvas.height;

  const ctx = videoCanvas.getContext("2d");

  let startTime = null;
  let animationId;

  function drawFrame(time){
    if(!startTime) startTime = time;

    const elapsed = (time - startTime) / 1000;
    const zoom = 1 + elapsed * 0.006;

    ctx.clearRect(0,0,videoCanvas.width,videoCanvas.height);

    ctx.save();
    ctx.translate(videoCanvas.width / 2, videoCanvas.height / 2);
    ctx.scale(zoom, zoom);
    ctx.translate(-videoCanvas.width / 2, -videoCanvas.height / 2);
    ctx.drawImage(canvas,0,0);
    ctx.restore();

    if(elapsed < duration){
      animationId = requestAnimationFrame(drawFrame);
    }
  }

  requestAnimationFrame(drawFrame);

  const canvasStream = videoCanvas.captureStream(30);
  let finalStream = canvasStream;

  if(audioFileURL){
    audio.currentTime = 0;
    await audio.play();

    const audioCtx = new AudioContext();
    const source = audioCtx.createMediaElementSource(audio);
    const dest = audioCtx.createMediaStreamDestination();

    source.connect(dest);
    source.connect(audioCtx.destination);

    finalStream = new MediaStream([
      ...canvasStream.getVideoTracks(),
      ...dest.stream.getAudioTracks()
    ]);

    $("status").innerText = "WEBM 영상 녹화 중. MP3 소리 포함.";
  }else{
    $("status").innerText = "WEBM 영상 녹화 중. 유튜브 소리는 저장에 포함되지 않을 수 있음.";
  }

  const recorder = new MediaRecorder(finalStream,{
    mimeType:"video/webm"
  });

  const chunks = [];

  recorder.ondataavailable = e => {
    if(e.data.size > 0) chunks.push(e.data);
  };

  recorder.onstop = () => {
    cancelAnimationFrame(animationId);

    audio.pause();

    const blob = new Blob(chunks,{type:"video/webm"});
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.download = "netflix-maker-video.webm";
    link.href = url;
    link.click();

    URL.revokeObjectURL(url);

    $("status").innerText = "WEBM 영상 저장 완료.";
  };

  recorder.start();

  setTimeout(()=>{
    recorder.stop();
  }, duration * 1000);
}

updateAll();
</script>

</body>
</html>
