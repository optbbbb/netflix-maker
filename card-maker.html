<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Music Card Home Maker</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f5f2;
  color:#222;
}
.wrap{
  display:grid;
  grid-template-columns:360px 1fr;
  min-height:100vh;
}
.panel{
  background:white;
  border-right:1px solid #ddd;
  padding:24px;
  overflow:auto;
  height:100vh;
}
h1{margin:0 0 18px;font-size:24px;letter-spacing:2px}
label{display:block;margin-top:14px;font-size:13px;color:#666;font-weight:700}
input,textarea{
  width:100%;
  margin-top:6px;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fafafa;
}
textarea{height:78px;resize:none}
button{
  width:100%;
  margin-top:14px;
  padding:13px;
  border:0;
  border-radius:12px;
  font-weight:900;
  cursor:pointer;
}
.add{background:#eee}
.make{background:#111;color:white}
.card-input{
  margin-top:18px;
  padding:14px;
  border:1px solid #ddd;
  border-radius:16px;
  background:#fafafa;
}
.remove{background:#ffe6e6;color:#b00000}
.preview{
  padding:48px;
  overflow:auto;
}
.site-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:32px;
}
.site-title h2{
  font-size:28px;
  letter-spacing:8px;
  margin:0;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:34px;
}
.music-card{
  background:white;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 16px 40px rgba(0,0,0,.08);
}
.music-card img{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
}
.card-body{
  padding:24px;
  min-height:150px;
  position:relative;
}
.song{
  color:#777;
  font-size:13px;
  margin-bottom:14px;
}
.quote{
  font-size:18px;
  line-height:1.6;
  margin-right:54px;
}
.name{
  margin-top:18px;
  font-weight:900;
}
.play{
  position:absolute;
  right:22px;
  bottom:24px;
  width:46px;
  height:46px;
  border:1px solid #aaa;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="wrap">
  <div class="panel">
    <h1>CARD MAKER</h1>

    <label>홈페이지 제목</label>
    <input id="pageTitle" value="MY MUSIC CARDS">

    <label>부제목</label>
    <input id="pageSub" value="나만의 음악 카드 모음">

    <div id="cards"></div>

    <button class="add" onclick="addCard()">+ 카드 추가</button>
    <button class="make" onclick="downloadHome()">홈페이지 HTML 뽑기</button>
  </div>

  <div class="preview">
    <div class="site-title">
      <div>
        <h2 id="previewTitle">MY MUSIC CARDS</h2>
        <p id="previewSub">나만의 음악 카드 모음</p>
      </div>
      <div>♪</div>
    </div>
    <div class="grid" id="previewGrid"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let cardCount=0;

function getYoutubeId(url){
  if(!url) return "";
  if(url.includes("watch?v=")) return url.split("v=")[1].split("&")[0];
  if(url.includes("youtu.be/")) return url.split("youtu.be/")[1].split("?")[0];
  return url.trim();
}

function addCard(){
  cardCount++;
  const box=document.createElement("div");
  box.className="card-input";
  box.innerHTML=`
    <label>이미지</label>
    <input type="file" class="img" accept="image/*">

    <label>카드 이름</label>
    <input class="name" value="하린">

    <label>한마디</label>
    <textarea class="quote">별빛이 내리는 밤, 우리의 이야기는 계속돼.</textarea>

    <label>노래 제목</label>
    <input class="song" value="Starry Night">

    <label>유튜브 링크 또는 ID</label>
    <input class="youtube" placeholder="https://youtu.be/...">

    <button class="remove" onclick="this.parentElement.remove();render()">삭제</button>
  `;
  $("cards").appendChild(box);

  box.querySelector(".img").onchange=e=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      e.target.dataset.src=reader.result;
      render();
    };
    reader.readAsDataURL(file);
  };

  box.querySelectorAll("input,textarea").forEach(el=>el.oninput=render);
  render();
}

function collect(){
  return [...document.querySelectorAll(".card-input")].map(box=>({
    img:box.querySelector(".img").dataset.src||"",
    name:box.querySelector(".name").value,
    quote:box.querySelector(".quote").value,
    song:box.querySelector(".song").value,
    youtube:getYoutubeId(box.querySelector(".youtube").value)
  }));
}

function render(){
  $("previewTitle").innerText=$("pageTitle").value;
  $("previewSub").innerText=$("pageSub").value;
  const cards=collect();
  $("previewGrid").innerHTML="";
  cards.forEach((c,i)=>{
    const div=document.createElement("div");
    div.className="music-card";
    div.innerHTML=`
      <img src="${c.img}">
      <div class="card-body">
        <div class="song">○ ${c.song}</div>
        <div class="quote">“${c.quote}”</div>
        <div class="name">${c.name}</div>
        <div class="play" onclick="playSong('${c.youtube}')">▶</div>
      </div>
    `;
    $("previewGrid").appendChild(div);
  });
}

let ytBox;
function playSong(id){
  if(!id) return alert("유튜브 링크를 넣어줘.");
  if(!ytBox){
    ytBox=document.createElement("div");
    ytBox.style.width="0";
    ytBox.style.height="0";
    ytBox.style.overflow="hidden";
    document.body.appendChild(ytBox);
  }
  ytBox.innerHTML=`
    <iframe width="1" height="1"
      src="https://www.youtube.com/embed/${id}?autoplay=1&enablejsapi=1"
      allow="autoplay">
    </iframe>`;
}

function escapeText(str){
  return String(str).replace(/`/g,"\\`").replace(/\$/g,"\\$");
}

function downloadHome(){
  const title=$("pageTitle").value;
  const sub=$("pageSub").value;
  const cards=collect();

  const html=`<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>${escapeText(title)}</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f5f2;color:#222}
.page{padding:54px;max-width:1400px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}
h1{font-size:30px;letter-spacing:8px;margin:0}
.sub{color:#777;margin-top:8px}
.music{font-size:28px;border:1px solid #ddd;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:34px}
.card{background:white;border-radius:22px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.08);transition:.25s}
.card:hover{transform:translateY(-6px)}
.card img{width:100%;height:270px;object-fit:cover;display:block}
.body{padding:24px;min-height:160px;position:relative}
.song{color:#777;font-size:13px;margin-bottom:14px}
.quote{font-size:18px;line-height:1.6;margin-right:54px;white-space:pre-line}
.name{margin-top:18px;font-weight:900}
.play{position:absolute;right:22px;bottom:24px;width:46px;height:46px;border:1px solid #aaa;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
@media(max-width:700px){.page{padding:26px}.grid{grid-template-columns:1fr}h1{font-size:24px;letter-spacing:5px}}
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div>
      <h1>${escapeText(title)}</h1>
      <div class="sub">${escapeText(sub)}</div>
    </div>
    <div class="music">♪</div>
  </div>
  <div class="grid">
    ${cards.map(c=>`
    <div class="card">
      <img src="${c.img}">
      <div class="body">
        <div class="song">○ ${escapeText(c.song)}</div>
        <div class="quote">“${escapeText(c.quote)}”</div>
        <div class="name">${escapeText(c.name)}</div>
        <div class="play" onclick="playSong('${c.youtube}')">▶</div>
      </div>
    </div>`).join("")}
  </div>
</div>
<div id="yt" style="width:0;height:0;overflow:hidden"></div>
<script>
function playSong(id){
  if(!id){alert("음악 링크가 없습니다.");return;}
  document.getElementById("yt").innerHTML =
    '<iframe width="1" height="1" src="https://www.youtube.com/embed/'+id+'?autoplay=1&enablejsapi=1" allow="autoplay"></iframe>';
}
<\/script>
</body>
</html>`;

  const blob=new Blob([html],{type:"text/html"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="music-cards-home.html";
  a.click();
  URL.revokeObjectURL(url);
}

$("pageTitle").oninput=render;
$("pageSub").oninput=render;
addCard();
</script>

</body>
</html>
