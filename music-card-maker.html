<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Card Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111110;
  --panel-bg:#1a1a18;
  --border:#2e2e2b;
  --text:#f0ede8;
  --muted:#666460;
  --accent:#f0ede8;
  --accent-inv:#111110;
  --purple:#5b4cff;
  --red:#ff3b30;
  --card-radius:24px;
  --panel-w:320px;
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --font-serif:'DM Serif Display',serif;
  --shadow-card:0 24px 56px rgba(0,0,0,.18),0 8px 16px rgba(0,0,0,.10);
  --shadow-hover:0 32px 72px rgba(0,0,0,.24),0 12px 24px rgba(0,0,0,.14);
  --transition:.22s cubic-bezier(.4,0,.2,1);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* ─── LAYOUT ─── */
.wrap{
  display:grid;
  grid-template-columns:var(--panel-w) 1fr;
  min-height:100vh;
}

/* ─── PANEL ─── */
.panel{
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  background:var(--panel-bg);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}

.panel::-webkit-scrollbar{width:4px}
.panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

.panel-header{
  padding:22px 20px 18px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  background:var(--panel-bg);
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.panel-logo{
  display:flex;
  align-items:center;
  gap:9px;
}

.logo-icon{
  width:32px;
  height:32px;
  background:var(--text);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:16px;
  flex-shrink:0;
}

.panel-logo h1{
  font-family:var(--font-display);
  font-size:18px;
  letter-spacing:.5px;
  line-height:1;
}

.panel-body{
  padding:20px;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:0;
}

.section-title{
  font-size:11px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:10px;
  margin-top:22px;
}

.section-title:first-child{margin-top:0}

.field{margin-bottom:12px}

.field label{
  display:block;
  font-size:12px;
  font-weight:500;
  color:var(--muted);
  margin-bottom:5px;
}

.field input,.field textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:13px;
  outline:none;
  transition:border-color var(--transition);
}

.field input:focus,.field textarea:focus{
  border-color:#555;
  background:var(--bg);
}

.field textarea{
  height:88px;
  resize:none;
  line-height:1.6;
}

/* ─── CARD ENTRIES LIST ─── */
.card-entries{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:4px;
}

.card-entry{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  transition:box-shadow var(--transition);
}

.card-entry.drag-over{
  box-shadow:0 0 0 2px var(--purple);
}

.entry-header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  cursor:pointer;
  user-select:none;
}

.drag-handle{
  color:var(--border);
  font-size:16px;
  cursor:grab;
  flex-shrink:0;
  line-height:1;
}

.drag-handle:active{cursor:grabbing}

.entry-thumb{
  width:36px;
  height:36px;
  border-radius:8px;
  background:var(--border);
  background-size:cover;
  background-position:center;
  flex-shrink:0;
}

.entry-info{flex:1;min-width:0}

.entry-name{
  font-size:13px;
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.entry-song{
  font-size:11px;
  color:var(--muted);
  margin-top:1px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.entry-toggle{
  color:var(--muted);
  font-size:13px;
  transition:transform var(--transition);
  flex-shrink:0;
}

.card-entry.open .entry-toggle{transform:rotate(180deg)}

.entry-body{
  display:none;
  padding:0 12px 14px;
  border-top:1px solid var(--border);
}

.card-entry.open .entry-body{display:block}

.entry-body .field{margin-bottom:10px}

.entry-body .field:last-child{margin-bottom:0}

.img-upload-area{
  border:1.5px dashed var(--border);
  border-radius:10px;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:border-color var(--transition);
  background:var(--panel-bg);
}

.img-upload-area:hover{border-color:#555}

.img-upload-area input[type=file]{
  position:absolute;
  inset:0;
  opacity:0;
  cursor:pointer;
  width:100%;
  height:100%;
}

.img-upload-text{
  font-size:12px;
  color:var(--muted);
  text-align:center;
  pointer-events:none;
}

.img-preview-thumb{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  border-radius:8px;
}

.img-clear-btn{
  position:absolute;
  top:5px;
  right:5px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  color:#fff;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:2;
  border:none;
}

.remove-entry-btn{
  width:100%;
  padding:8px;
  border:1px solid #ffd5d5;
  border-radius:8px;
  background:#fff8f8;
  color:var(--red);
  font-size:12px;
  font-weight:500;
  cursor:pointer;
  margin-top:10px;
  font-family:var(--font-body);
  transition:background var(--transition);
}

.remove-entry-btn:hover{background:#ffe5e5}

/* ─── PANEL FOOTER BUTTONS ─── */
.panel-footer{
  padding:16px 20px;
  border-top:1px solid var(--border);
  display:flex;
  flex-direction:column;
  gap:8px;
  background:var(--panel-bg);
}

.btn{
  width:100%;
  padding:11px;
  border:none;
  border-radius:12px;
  font-family:var(--font-body);
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:opacity var(--transition),transform .1s;
}

.btn:active{transform:scale(.98)}

.btn-add{
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
}

.btn-add:hover{background:#252522}

.btn-export{
  background:var(--purple);
  color:#fff;
}

.btn-export:hover{opacity:.88}

/* ─── PREVIEW ─── */
.preview{
  padding:48px 52px;
  min-height:100vh;
  overflow:hidden;
}

.preview-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  margin-bottom:72px;
}

.preview-titles{flex:1}

.site-heading{
  font-family:var(--font-display);
  font-size:52px;
  letter-spacing:6px;
  line-height:1;
  color:var(--text);
}

.site-sub{
  font-size:16px;
  color:var(--muted);
  margin-top:8px;
  font-weight:300;
}

.music-badge{
  width:56px;
  height:56px;
  border:1px solid var(--border);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  background:var(--panel-bg);
  flex-shrink:0;
  animation:spin 12s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

/* ─── CARDS GRID ─── */
.cards-row{
  display:flex;
  gap:22px;
  overflow-x:auto;
  overflow-y:visible;
  padding:16px 0 48px;
  scroll-behavior:smooth;
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}

.cards-row::-webkit-scrollbar{height:6px}
.cards-row::-webkit-scrollbar-track{background:transparent}
.cards-row::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

/* ─── MUSIC CARD ─── */
.music-card{
  flex:0 0 288px;
  width:288px;
  height:544px;
  border-radius:var(--card-radius);
  overflow:hidden;
  position:relative;
  background:#222;
  box-shadow:var(--shadow-card);
  cursor:pointer;
  transition:transform var(--transition),box-shadow var(--transition);
}

.music-card:hover{
  transform:translateY(-10px) scale(1.01);
  box-shadow:var(--shadow-hover);
}

.music-card.playing{
  transform:translateY(-14px) scale(1.02);
  box-shadow:var(--shadow-hover);
}

.card-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  transition:transform 8s ease;
}

.music-card:hover .card-bg{transform:scale(1.05)}

.card-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(var(--mc),0.08) 0%,
    transparent 40%,
    rgba(var(--mc),0.4) 65%,
    rgba(0,0,0,.88) 100%
  );
}

.card-noise{
  position:absolute;
  inset:0;
  opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
}

.card-top{
  position:absolute;
  top:0;left:0;right:0;
  z-index:4;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.card-tag{
  display:flex;
  align-items:center;
  gap:5px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.18);
  border-radius:99px;
  padding:4px 10px 4px 8px;
  color:#fff;
  font-size:11px;
  font-weight:500;
  letter-spacing:.3px;
  max-width:180px;
}

.card-tag-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:rgba(255,255,255,.7);
  flex-shrink:0;
}

.music-card.playing .card-tag-dot{
  background:#4cff82;
  box-shadow:0 0 6px #4cff82;
  animation:pulse-dot 1.2s ease infinite;
}

@keyframes pulse-dot{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.6;transform:scale(.7)}
}

.card-tag-text{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.now-label{
  display:none;
  font-size:9px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:rgba(255,255,255,.7);
  background:rgba(255,255,255,.1);
  border-radius:4px;
  padding:2px 5px;
}

.music-card.playing .now-label{display:block}

.card-body{
  position:absolute;
  bottom:0;left:0;right:0;
  z-index:4;
  padding:22px 22px 24px;
}

.card-quote{
  font-family:var(--font-serif);
  font-style:italic;
  font-size:19px;
  line-height:1.5;
  color:#fff;
  white-space:pre-line;
  margin-bottom:18px;
  text-shadow:0 1px 8px rgba(0,0,0,.3);
}

.card-divider{
  width:28px;
  height:1px;
  background:rgba(255,255,255,.5);
  margin-bottom:16px;
}

.card-name{
  font-size:16px;
  font-weight:700;
  color:#fff;
  letter-spacing:.3px;
}



.card-num{
  position:absolute;
  top:18px;
  right:20px;
  font-size:11px;
  font-weight:700;
  color:rgba(255,255,255,.45);
  z-index:4;
  letter-spacing:.5px;
}

/* ─── EMPTY STATE ─── */
.empty-state{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:480px;
  color:var(--muted);
  gap:12px;
}

.empty-icon{
  font-size:48px;
  opacity:.25;
}

.empty-text{font-size:14px;font-weight:300}

/* ─── MOBILE TOGGLE ─── */
.mobile-toggle{
  display:none;
  position:fixed;
  bottom:24px;
  right:24px;
  z-index:100;
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--text);
  color:#fff;
  border:none;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
  align-items:center;
  justify-content:center;
}

/* ─── HIDDEN YT ─── */
#ytBox{position:fixed;bottom:-1px;right:-1px;width:1px;height:1px;overflow:hidden}

/* ─── RESPONSIVE ─── */
@media(max-width:900px){
  .wrap{
    grid-template-columns:1fr;
  }

  .panel{
    position:fixed;
    left:-100%;
    top:0;
    bottom:0;
    z-index:50;
    width:min(320px, 90vw);
    height:100dvh;
    transition:left var(--transition);
    box-shadow:8px 0 40px rgba(0,0,0,.12);
  }

  .panel.open{left:0}

  .panel-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    z-index:49;
    backdrop-filter:blur(4px);
  }

  .panel-overlay.show{display:block}

  .preview{
    padding:36px 24px;
    min-height:100vh;
  }

  .preview-header{margin-bottom:40px}

  .site-heading{font-size:36px;letter-spacing:3px}

  .mobile-toggle{display:flex}

  .music-card{flex-basis:260px;width:260px;height:490px}

  .cards-row{gap:16px;padding:12px 0 40px}
}

@media(max-width:500px){
  .preview{padding:28px 18px}
  .site-heading{font-size:28px;letter-spacing:2px}
  .music-card{flex-basis:240px;width:240px;height:450px}
}
</style>
</head>
<body>

<div id="panelOverlay" class="panel-overlay" onclick="closePanel()"></div>

<div class="wrap">

  <!-- PANEL -->
  <div class="panel" id="panel">
    <div class="panel-header">
      <div class="panel-logo">
        <div class="logo-icon">♪</div>
        <h1>MUSIC CARDS</h1>
      </div>
    </div>

    <div class="panel-body">
      <p class="section-title">페이지 설정</p>
      <div class="field">
        <label>제목</label>
        <input id="pageTitle" value="" oninput="render()">
      </div>
      <div class="field">
        <label>부제목</label>
        <input id="pageSub" value="" oninput="render()">
      </div>

      <p class="section-title" style="margin-top:20px">카드 목록 <span id="cardCount" style="font-weight:400;color:var(--muted)"></span></p>
      <div id="cardEntries" class="card-entries"></div>
    </div>

    <div class="panel-footer">
      <button class="btn btn-add" onclick="addCard()">
        <span>+</span> 카드 추가
      </button>
      <button class="btn btn-export" onclick="downloadHome()">
        ↓ &nbsp;홈페이지 HTML 내보내기
      </button>
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="preview" id="preview">
    <div class="preview-header">
      <div class="preview-titles">
        <h2 class="site-heading" id="previewTitle"></h2>
        <p class="site-sub" id="previewSub"></p>
      </div>
    </div>

    <div class="cards-row" id="cardsRow">
      <div class="empty-state">
        <div class="empty-icon">🎵</div>
        <div class="empty-text">카드를 추가해 음악 홈을 만들어보세요</div>
      </div>
    </div>
  </div>

</div>

<button class="mobile-toggle" id="mobileToggle" onclick="togglePanel()">☰</button>

<div id="ytBox"></div>

<script>
const $ = id => document.getElementById(id);

let cards = [];
let currentYtId = '';
let dragSrc = null;

// ──────────────────────────────────────────
// CARD DATA MODEL
// ──────────────────────────────────────────
function makeCard(data = {}){
  return {
    id: 'c' + Date.now() + Math.random().toString(36).slice(2),
    name: data.name || '아티스트',
    quote: data.quote || '',
    song: data.song || 'Starry Night',
    youtube: data.youtube || '',
    img: data.img || '',
    color: data.color || '30,30,30',
    open: true
  };
}

// ──────────────────────────────────────────
// YOUTUBE
// ──────────────────────────────────────────
function parseYtId(url){
  if(!url) return '';
  url = url.trim();
  let m;
  m = url.match(/[?&]v=([^&]+)/); if(m) return m[1];
  m = url.match(/youtu\.be\/([^?&]+)/); if(m) return m[1];
  m = url.match(/embed\/([^?&]+)/); if(m) return m[1];
  if(/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
  return '';
}

function ytThumb(id){
  return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : '';
}

// ──────────────────────────────────────────
// COLOR EXTRACTION
// ──────────────────────────────────────────
function extractColor(src){
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try{
        const cv = document.createElement('canvas');
        cv.width = cv.height = 50;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img,0,0,50,50);
        const d = ctx.getImageData(0,0,50,50).data;
        let r=0,g=0,b=0,n=0;
        for(let i=0;i<d.length;i+=4){
          r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++;
        }
        resolve(`${Math.floor(r/n)},${Math.floor(g/n)},${Math.floor(b/n)}`);
      } catch(e){ resolve('30,30,30'); }
    };
    img.onerror = () => resolve('30,30,30');
    img.src = src;
  });
}

// ──────────────────────────────────────────
// PANEL CARD ENTRY
// ──────────────────────────────────────────
function buildEntry(card){
  const el = document.createElement('div');
  el.className = 'card-entry' + (card.open ? ' open' : '');
  el.dataset.id = card.id;
  el.draggable = true;

  el.innerHTML = `
    <div class="entry-header" onclick="toggleEntry('${card.id}')">
      <div class="drag-handle" draggable="false">⠿</div>
      <div class="entry-thumb" id="thumb-${card.id}" style="${card.img ? `background-image:url('${card.img}')` : ''}"></div>
      <div class="entry-info">
        <div class="entry-name" id="ename-${card.id}">${esc(card.name)}</div>
        <div class="entry-song" id="esong-${card.id}">${esc(card.song)}</div>
      </div>
      <div class="entry-toggle">▾</div>
    </div>
    <div class="entry-body">
      <div class="field" style="margin-top:10px">
        <label>앨범 이미지</label>
        <div class="img-upload-area" id="imgArea-${card.id}">
          ${card.img ? `<div class="img-preview-thumb" id="imgThumb-${card.id}" style="background-image:url('${card.img}')"></div>` : ''}
          <div class="img-upload-text" id="imgText-${card.id}" ${card.img ? 'style="display:none"' : ''}>
            <div style="font-size:18px;margin-bottom:4px">🖼</div>
            <div>이미지 업로드</div>
          </div>
          ${card.img ? `<button class="img-clear-btn" onclick="clearImg('${card.id}',event)">✕</button>` : ''}
          <input type="file" accept="image/*" onchange="onImgChange('${card.id}',this)">
        </div>
      </div>
      <div class="field">
        <label>이름</label>
        <input value="${esc(card.name)}" oninput="updateCard('${card.id}','name',this.value)">
      </div>
      <div class="field">
        <label>한마디</label>
        <textarea oninput="updateCard('${card.id}','quote',this.value)">${esc(card.quote)}</textarea>
      </div>
      <div class="field">
        <label>노래 제목</label>
        <input value="${esc(card.song)}" oninput="updateCard('${card.id}','song',this.value)">
      </div>
      <div class="field">
        <label>YouTube 링크 / ID</label>
        <input value="${esc(card.youtube)}" placeholder="https://youtu.be/..." oninput="updateCard('${card.id}','youtube',this.value)">
      </div>
      <button class="remove-entry-btn" onclick="removeCard('${card.id}')">카드 삭제</button>
    </div>
  `;

  // drag
  el.addEventListener('dragstart', e => {
    dragSrc = card.id;
    setTimeout(() => el.style.opacity = '.4', 0);
    e.dataTransfer.effectAllowed = 'move';
  });
  el.addEventListener('dragend', () => {
    el.style.opacity = '';
    document.querySelectorAll('.card-entry').forEach(e => e.classList.remove('drag-over'));
  });
  el.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    el.classList.add('drag-over');
  });
  el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
  el.addEventListener('drop', e => {
    e.preventDefault();
    el.classList.remove('drag-over');
    if(dragSrc === card.id) return;
    const si = cards.findIndex(c=>c.id===dragSrc);
    const ti = cards.findIndex(c=>c.id===card.id);
    const [moved] = cards.splice(si,1);
    cards.splice(ti,0,moved);
    renderPanel();
    render();
  });

  return el;
}

function toggleEntry(id){
  const c = cards.find(c=>c.id===id);
  if(c){ c.open = !c.open; renderPanel(); }
}

// ──────────────────────────────────────────
// PANEL RENDER
// ──────────────────────────────────────────
function renderPanel(){
  const container = $('cardEntries');
  container.innerHTML = '';
  cards.forEach(c => container.appendChild(buildEntry(c)));
  $('cardCount').textContent = cards.length ? `(${cards.length})` : '';
}

// ──────────────────────────────────────────
// UPDATE / ADD / REMOVE
// ──────────────────────────────────────────
function updateCard(id, key, val){
  const c = cards.find(c=>c.id===id);
  if(!c) return;
  c[key] = val;
  // update label in header live
  if(key==='name'){ const el=$(`ename-${id}`); if(el) el.textContent=val; }
  if(key==='song'){ const el=$(`esong-${id}`); if(el) el.textContent=val; }
  render();
}

async function onImgChange(id, input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const src = reader.result;
    const c = cards.find(c=>c.id===id);
    if(!c) return;
    c.img = src;
    c.color = await extractColor(src);

    // update thumb in header
    const thumb = $(`thumb-${id}`);
    if(thumb) thumb.style.backgroundImage = `url('${src}')`;

    // update preview in entry
    let area = $(`imgArea-${id}`);
    if(area){
      let pt = document.getElementById(`imgThumb-${id}`);
      if(!pt){
        pt = document.createElement('div');
        pt.className = 'img-preview-thumb';
        pt.id = `imgThumb-${id}`;
        area.prepend(pt);
      }
      pt.style.backgroundImage = `url('${src}')`;

      const txt = $(`imgText-${id}`);
      if(txt) txt.style.display='none';

      if(!area.querySelector('.img-clear-btn')){
        const cb = document.createElement('button');
        cb.className='img-clear-btn';
        cb.textContent='✕';
        cb.onclick = ev => clearImg(id,ev);
        area.appendChild(cb);
      }
    }
    render();
  };
  reader.readAsDataURL(file);
}

function clearImg(id, e){
  e && e.stopPropagation();
  const c = cards.find(c=>c.id===id);
  if(!c) return;
  c.img = '';
  c.color = '30,30,30';
  const thumb = $(`thumb-${id}`);
  if(thumb) thumb.style.backgroundImage='';
  const pt = $(`imgThumb-${id}`);
  if(pt) pt.remove();
  const txt = $(`imgText-${id}`);
  if(txt) txt.style.display='';
  const area = $(`imgArea-${id}`);
  if(area){ const cb=area.querySelector('.img-clear-btn'); if(cb) cb.remove(); }
  render();
}

function addCard(){
  const c = makeCard();
  cards.push(c);
  renderPanel();
  render();
  // scroll to bottom
  $('cardEntries').lastElementChild?.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function removeCard(id){
  cards = cards.filter(c=>c.id!==id);
  if(currentYtId && currentYtId===id) stopSong();
  renderPanel();
  render();
}

// ──────────────────────────────────────────
// PREVIEW RENDER
// ──────────────────────────────────────────
function render(){
  $('previewTitle').textContent = $('pageTitle').value;
  $('previewSub').textContent = $('pageSub').value;

  const row = $('cardsRow');
  row.innerHTML = '';

  if(!cards.length){
    row.innerHTML = `<div class="empty-state"><div class="empty-icon">🎵</div><div class="empty-text">카드를 추가해 음악 홈을 만들어보세요</div></div>`;
    return;
  }

  cards.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'music-card';
    el.dataset.ytid = c.id;
    el.style.setProperty('--mc', c.color || '30,30,30');
    el.onclick = () => playSong(c, el);

    const bgStyle = c.img
      ? `background-image:url('${c.img}')`
      : `background:linear-gradient(135deg,#${randomGrad(c.color)},#111)`;

    el.innerHTML = `
      <div class="card-bg" style="${bgStyle}"></div>
      <div class="card-overlay"></div>
      <div class="card-noise"></div>
      <div class="card-top">
        <div class="card-tag">
          <div class="card-tag-dot"></div>
          <div class="card-tag-text">${esc(c.song||'Untitled')}</div>
        </div>
        <div class="now-label">PLAYING</div>
      </div>
      <div class="card-num">${String(i+1).padStart(2,'0')}</div>
      <div class="card-body">
        ${c.quote ? `<div class="card-quote">${esc(c.quote)}</div><div class="card-divider"></div>` : ''}
        <div class="card-name">${esc(c.name||'')}</div>
      </div>
    `;

    row.appendChild(el);
  });
}

function randomGrad(colorStr){
  if(!colorStr) return '888';
  const parts = colorStr.split(',').map(Number);
  const hex = parts.map(v => Math.min(255,v+40).toString(16).padStart(2,'0')).join('');
  return hex;
}

// ──────────────────────────────────────────
// PLAYBACK
// ──────────────────────────────────────────
function stopSong(){
  currentYtId = '';
  $('ytBox').innerHTML = '';
  document.querySelectorAll('.music-card').forEach(c => c.classList.remove('playing'));
}

function playSong(card, cardEl){
  const id = parseYtId(card.youtube);
  if(!id){
    cardEl?.classList.toggle('playing');
    return;
  }
  if(currentYtId === id){
    stopSong();
    return;
  }
  currentYtId = id;
  document.querySelectorAll('.music-card').forEach(c => c.classList.remove('playing'));
  cardEl?.classList.add('playing');
  $('ytBox').innerHTML = `<iframe width="1" height="1" src="https://www.youtube.com/embed/${id}?autoplay=1&enablejsapi=1" allow="autoplay"></iframe>`;
}

// ──────────────────────────────────────────
// MOBILE PANEL
// ──────────────────────────────────────────
function togglePanel(){
  const panel = $('panel');
  const overlay = $('panelOverlay');
  const open = panel.classList.toggle('open');
  overlay.classList.toggle('show', open);
  $('mobileToggle').textContent = open ? '✕' : '☰';
}

function closePanel(){
  $('panel').classList.remove('open');
  $('panelOverlay').classList.remove('show');
  $('mobileToggle').textContent = '☰';
}

// ──────────────────────────────────────────
// EXPORT
// ──────────────────────────────────────────
function esc(str){
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
