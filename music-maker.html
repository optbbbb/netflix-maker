<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Character Music Home Maker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101010;
  color:white;
  font-family:Arial, sans-serif;
}

.wrap{
  min-height:100vh;
  display:grid;
  grid-template-columns:390px 1fr;
}

.panel{
  padding:28px;
  background:#181818;
  overflow:auto;
  height:100vh;
}

h1{
  margin:0 0 24px;
  font-size:28px;
}

label{
  display:block;
  margin-top:15px;
  color:#aaa;
  font-size:13px;
  font-weight:700;
}

input{
  width:100%;
  margin-top:7px;
  padding:12px;
  border:1px solid #444;
  border-radius:8px;
  background:#242424;
  color:white;
}

button{
  width:100%;
  margin-top:16px;
  padding:14px;
  border:0;
  border-radius:999px;
  font-weight:900;
  cursor:pointer;
}

.add{
  background:#333;
  color:white;
}

.make{
  background:white;
  color:black;
}

.song{
  margin-top:18px;
  padding:16px;
  background:#202020;
  border:1px solid #333;
  border-radius:16px;
}

.remove{
  background:#672020;
  color:white;
  padding:10px;
}

.preview{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
}

.phone{
  width:390px;
  height:760px;
  background:#121212;
  border-radius:34px;
  overflow:hidden;
  box-shadow:0 25px 90px rgba(0,0,0,.65);
}

.hero{
  height:390px;
  background:#333;
  position:relative;
  overflow:hidden;
  cursor:grab;
}

.hero:active{
  cursor:grabbing;
}

.hero-img{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform-origin:center;
  user-select:none;
  pointer-events:none;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      0deg,
      #121212 0%,
      rgba(18,18,18,.95) 12%,
      rgba(18,18,18,.72) 28%,
      rgba(18,18,18,.28) 52%,
      rgba(18,18,18,0) 78%
    );
  pointer-events:none;
}

.hero-text{
  position:absolute;
  left:24px;
  right:24px;
  bottom:58px;
  z-index:2;
}

.hero-title{
  font-size:34px;
  font-weight:900;
  line-height:1.1;
}

.hero-sub{
  margin-top:8px;
  color:#ddd;
  font-size:18px;
}

.controls{
  height:110px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:34px;
  font-size:28px;
}

.play{
  width:68px;
  height:68px;
  border-radius:50%;
  background:white;
  color:black;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:900;
  cursor:pointer;
}

.list{
  padding:20px 22px;
}

.list-title{
  font-size:23px;
  font-weight:900;
  margin-bottom:16px;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
  cursor:pointer;
  padding:8px;
  border-radius:10px;
}

.item:hover{
  background:#202020;
}

.item.active{
  background:#282828;
}

.thumb{
  width:54px;
  height:54px;
  background:#333;
  background-size:cover;
  background-position:center;
  flex-shrink:0;
}

.item-name{
  font-size:18px;
  font-weight:800;
}

.item-artist{
  color:#aaa;
  font-size:14px;
  margin-top:4px;
}

.result{
  margin-top:20px;
}

.youtube-box{
  width:0;
  height:0;
  overflow:hidden;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="panel">
    <h1>music home maker</h1>

    <label>홈피 제목</label>
    <input id="homeTitle" value="내 현재 재생목록">

    <label>캐릭터 / 제작자 이름</label>
    <input id="homeName" value="OP T">

    <label>메인 캐릭터 이미지</label>
    <input type="file" id="mainImage" accept="image/*">

    <label>이미지 확대</label>
    <input type="range" id="imageScale" min="1" max="2.5" step="0.01" value="1">

    <button class="add" onclick="resetImagePosition()">이미지 위치 초기화</button>

    <div id="songList"></div>

    <button class="add" onclick="addSong()">+ 노래 추가</button>
    <button class="make" onclick="makeHome()">홈피 만들기</button>

    <label>완성 링크</label>
    <input class="result" id="resultLink" readonly>
  </div>

  <div class="preview">
    <div class="phone">
      <div class="hero" id="previewHero">
        <img class="hero-img" id="heroImg" draggable="false">

        <div class="hero-text">
          <div class="hero-title" id="previewTitle">내 현재 재생목록</div>
          <div class="hero-sub" id="previewName">OP T</div>
        </div>
      </div>

      <div class="controls">
        <div>⏮</div>
        <div class="play" id="previewPlayBtn" onclick="previewToggleMusic()">▶</div>
        <div>⏭</div>
      </div>

      <div class="list">
        <div class="list-title">playlist</div>
        <div id="previewSongs"></div>
      </div>
    </div>
  </div>
</div>

<div class="youtube-box" id="youtubeBox"></div>

<script>
const $ = id => document.getElementById(id);

let mainImageData = "";
let songIndex = 0;

let imgX = 0;
let imgY = 0;
let imgScale = 1;

let dragging = false;
let startX = 0;
let startY = 0;
let startImgX = 0;
let startImgY = 0;

let previewPlaying = false;
let previewCurrentIndex = 0;

function getYoutubeId(url){
  if(!url) return "";

  if(url.includes("youtube.com/watch?v=")){
    return url.split("v=")[1].split("&")[0];
  }

  if(url.includes("youtu.be/")){
    return url.split("youtu.be/")[1].split("?")[0];
  }

  return url.trim();
}

function applyImageTransform(){
  $("heroImg").style.transform =
    `translate(${imgX}px, ${imgY}px) scale(${imgScale})`;
}

$("previewHero").addEventListener("mousedown", e=>{
  if(!mainImageData) return;

  dragging = true;
  startX = e.clientX;
  startY = e.clientY;
  startImgX = imgX;
  startImgY = imgY;
});

window.addEventListener("mousemove", e=>{
  if(!dragging) return;

  imgX = startImgX + (e.clientX - startX);
  imgY = startImgY + (e.clientY - startY);

  applyImageTransform();
});

window.addEventListener("mouseup", ()=>{
  dragging = false;
});

$("imageScale").oninput = e=>{
  imgScale = parseFloat(e.target.value);
  applyImageTransform();
};

function resetImagePosition(){
  imgX = 0;
  imgY = 0;
  imgScale = 1;

  $("imageScale").value = 1;
  applyImageTransform();
}

function addSong(){
  songIndex++;

  const box = document.createElement("div");
  box.className = "song";

  box.innerHTML = `
    <label>앨범 이미지</label>
    <input type="file" class="song-cover" accept="image/*">

    <label>노래 제목</label>
    <input class="song-title" value="GAL">

    <label>아티스트 / 캐릭터명</label>
    <input class="song-artist" value="OHAYO">

    <label>유튜브 링크 또는 ID</label>
    <input class="song-youtube" placeholder="https://youtu.be/...">

    <label>재생시간</label>
    <input class="song-time" value="2:53">

    <button class="remove" onclick="this.parentElement.remove(); updatePreview();">삭제</button>
  `;

  $("songList").appendChild(box);

  const fileInput = box.querySelector(".song-cover");

  fileInput.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();

    reader.onload = () => {
      fileInput.dataset.image = reader.result;
      updatePreview();
    };

    reader.readAsDataURL(file);
  };

  box.querySelectorAll("input").forEach(input=>{
    input.oninput = updatePreview;
  });

  updatePreview();
}

$("homeTitle").oninput = updatePreview;
$("homeName").oninput = updatePreview;

$("mainImage").onchange = e => {
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    mainImageData = reader.result;
    $("heroImg").src = mainImageData;
    resetImagePosition();
    updatePreview();
  };

  reader.readAsDataURL(file);
};

function collectSongs(){
  const boxes = document.querySelectorAll(".song");

  return [...boxes].map(box=>{
    return {
      title: box.querySelector(".song-title").value,
      artist: box.querySelector(".song-artist").value,
      youtube: getYoutubeId(box.querySelector(".song-youtube").value),
      time: box.querySelector(".song-time").value,
      cover: box.querySelector(".song-cover").dataset.image || mainImageData
    };
  }).filter(song=>song.title);
}

function previewLoadSong(song, index){
  if(!song.youtube) return;

  previewCurrentIndex = index;
  previewPlaying = false;
  $("previewPlayBtn").innerText = "▶";

  $("youtubeBox").innerHTML = `
    <iframe
      id="previewYt"
      width="1"
      height="1"
      src="https://www.youtube.com/embed/${song.youtube}?enablejsapi=1&origin=${location.origin}"
      allow="autoplay"
    ></iframe>
  `;

  document.querySelectorAll(".item").forEach((item, i)=>{
    item.classList.toggle("active", i === index);
  });
}

function previewToggleMusic(){
  const iframe = document.getElementById("previewYt");
  const songs = collectSongs();

  if(!iframe){
    if(songs.length){
      previewLoadSong(songs[0], 0);
    }
    return;
  }

  if(!previewPlaying){
    iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    $("previewPlayBtn").innerText = "Ⅱ";
    previewPlaying = true;
  }else{
    iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    $("previewPlayBtn").innerText = "▶";
    previewPlaying = false;
  }
}

function updatePreview(){
  $("previewTitle").innerText = $("homeTitle").value;
  $("previewName").innerText = $("homeName").value;

  const songs = collectSongs();

  $("previewSongs").innerHTML = "";

  songs.forEach((song, index)=>{
    const item = document.createElement("div");
    item.className = "item" + (index === previewCurrentIndex ? " active" : "");

    item.onclick = () => {
      previewLoadSong(song, index);
    };

    item.innerHTML = `
      <div class="thumb" style="background-image:url('${song.cover || ""}')"></div>
      <div>
        <div class="item-name">${song.title}</div>
        <div class="item-artist">${song.artist} · ${song.time}</div>
      </div>
    `;

    $("previewSongs").appendChild(item);
  });
}

function makeHome(){
  const data = {
    title: $("homeTitle").value,
    maker: $("homeName").value,
    mainImage: mainImageData,
    imagePosition:{
      x: imgX,
      y: imgY,
      scale: imgScale
    },
    songs: collectSongs().filter(song=>song.youtube)
  };

  localStorage.setItem("musicHomeData", JSON.stringify(data));

  const base = location.href
    .replace("index.html","")
    .replace("music-maker.html","");

  const url = base + "player.html";

  $("resultLink").value = url;
  window.open(url, "_blank");
}

addSong();
</script>

</body>
</html>
