<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Music Home Maker</title>

<style>
*{box-sizing:border-box}

:root{
  --accent:#1DB954;
  --coverColor:rgba(80,80,80,.65);
}

body{
  margin:0;
  background:#101010;
  color:white;
  font-family:Arial, sans-serif;
}

.wrap{
  min-height:100vh;
  display:grid;
  grid-template-columns:390px 1fr;
}

.panel{
  height:100vh;
  overflow:auto;
  padding:28px;
  background:#181818;
  border-right:1px solid #292929;
}

h1{
  margin:0 0 20px;
  font-size:26px;
}

label{
  display:block;
  margin-top:15px;
  color:#aaa;
  font-size:13px;
  font-weight:700;
}

input{
  width:100%;
  margin-top:7px;
  padding:12px;
  border:1px solid #444;
  border-radius:8px;
  background:#242424;
  color:white;
}

input[type="color"]{
  height:48px;
  padding:4px;
}

button{
  width:100%;
  margin-top:16px;
  padding:14px;
  border:0;
  border-radius:999px;
  font-weight:900;
  cursor:pointer;
}

.add{
  background:#333;
  color:white;
}

.make{
  background:var(--accent);
  color:black;
}

.remove{
  background:#672020;
  color:white;
  padding:10px;
}

.song{
  margin-top:18px;
  padding:16px;
  background:#202020;
  border:1px solid #333;
  border-radius:16px;
}

.preview{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
  background:#101010;
}

.app{
  width:min(100%,460px);
  min-height:760px;
  background:#121212;
  overflow:hidden;
  border-radius:22px;
  box-shadow:0 25px 90px rgba(0,0,0,.65);
}

.album-head{
  padding:28px 26px 24px;
  background:
    linear-gradient(
      180deg,
      var(--coverColor) 0%,
      rgba(18,18,18,.96) 88%
    );
}

.album-info{
  display:flex;
  align-items:flex-end;
  gap:20px;
}

.cover-wrap{
  width:132px;
  height:132px;
  background:#333;
  flex-shrink:0;
  overflow:hidden;
  cursor:grab;
  box-shadow:0 12px 35px rgba(0,0,0,.45);
}

.cover-wrap:active{
  cursor:grabbing;
}

.cover-img{
  width:100%;
  height:100%;
  object-fit:cover;
  transform-origin:center;
  user-select:none;
  pointer-events:none;
}

.type{
  font-size:12px;
  font-weight:900;
  color:#eee;
  margin-bottom:8px;
}

.album-title{
  font-size:42px;
  font-weight:900;
  line-height:.95;
  margin-bottom:10px;
  word-break:keep-all;
}

.album-meta{
  font-size:14px;
  color:#ddd;
  line-height:1.45;
}

.actions{
  display:flex;
  align-items:center;
  gap:22px;
  padding:18px 26px 8px;
}

.play-main{
  width:54px;
  height:54px;
  border-radius:50%;
  background:var(--accent);
  color:black;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:900;
  cursor:pointer;
  padding-left:4px;
}

.action-icon{
  color:#bbb;
  font-size:25px;
  cursor:pointer;
}

.action-icon:hover{
  color:white;
}

.action-icon.active{
  color:var(--accent);
}

.list-mode{
  margin-left:auto;
  color:#aaa;
  font-size:14px;
  font-weight:800;
}

.song-table{
  padding:8px 26px 34px;
}

.table-head{
  display:grid;
  grid-template-columns:34px 1fr 54px;
  color:#999;
  font-size:13px;
  padding:10px 0;
  border-bottom:1px solid #2a2a2a;
}

.preview-item{
  display:grid;
  grid-template-columns:34px 1fr 54px;
  align-items:center;
  padding:12px 0;
  border-radius:8px;
  cursor:pointer;
}

.preview-item:hover{
  background:#1b1b1b;
  margin:0 -8px;
  padding:12px 8px;
}

.preview-item.active{
  background:#242424;
  margin:0 -8px;
  padding:12px 8px;
}

.index{
  color:#aaa;
  font-size:15px;
}

.preview-title{
  font-size:15px;
  font-weight:900;
}

.preview-artist{
  margin-top:4px;
  color:#999;
  font-size:13px;
}

.time{
  color:#aaa;
  font-size:13px;
  text-align:right;
}

.result{
  margin-top:20px;
}

.youtube-box{
  width:0;
  height:0;
  overflow:hidden;
}

@media(max-width:900px){
  .wrap{
    grid-template-columns:1fr;
  }

  .panel{
    height:auto;
  }

  .preview{
    padding:20px;
  }
}

@media(max-width:520px){
  .app{
    width:100%;
    min-height:100vh;
    border-radius:0;
  }

  .album-info{
    align-items:flex-start;
    flex-direction:column;
  }

  .cover-wrap{
    width:148px;
    height:148px;
  }

  .album-title{
    font-size:38px;
  }
}
</style>
</head>

<body>

<div class="wrap">
  <div class="panel">
    <h1>music home maker</h1>

    <label>앨범 / 홈피 제목</label>
    <input id="homeTitle" value="EVOL">

    <label>캐릭터 / 아티스트명</label>
    <input id="homeName" value="Royal 44">

    <label>앨범 커버 이미지</label>
    <input type="file" id="mainImage" accept="image/*">

    <label>커버 확대</label>
    <input type="range" id="imageScale" min="1" max="2.5" step="0.01" value="1">

    <button class="add" onclick="resetImagePosition()">커버 위치 초기화</button>

    <label>재생 버튼 색상</label>
    <input type="color" id="accentColor" value="#1DB954">

    <div id="songList"></div>

    <button class="add" onclick="addSong()">+ 노래 추가</button>
    <button class="make" onclick="makeHome()">홈피 만들기</button>

    <label>완성 링크</label>
    <input class="result" id="resultLink" readonly>
  </div>

  <div class="preview">
    <div class="app">
      <div class="album-head">
        <div class="album-info">
          <div class="cover-wrap" id="coverWrap">
            <img class="cover-img" id="coverImg" draggable="false">
          </div>

          <div>
            <div class="type">앨범</div>
            <div class="album-title" id="previewTitle">EVOL</div>
            <div class="album-meta">
              <b id="previewName">Royal 44</b> · 2025 ·
              <span id="songCountText">0곡</span>
            </div>
          </div>
        </div>
      </div>

      <div class="actions">
        <div class="play-main" id="previewPlayBtn" onclick="previewToggleMusic()">▶</div>
        <div class="action-icon" id="loopBtn" onclick="toggleLoop()">↻</div>
        <div class="action-icon">⋯</div>
        <div class="list-mode">목록 ☰</div>
      </div>

      <div class="song-table">
        <div class="table-head">
          <div>#</div>
          <div>제목</div>
          <div>⏱</div>
        </div>

        <div id="previewSongs"></div>
      </div>
    </div>
  </div>
</div>

<div class="youtube-box" id="youtubeBox"></div>

<script>
const $ = id => document.getElementById(id);

let mainImageData = "";
let songIndex = 0;

let imgX = 0;
let imgY = 0;
let imgScale = 1;

let dragging = false;
let startX = 0;
let startY = 0;
let startImgX = 0;
let startImgY = 0;

let previewPlaying = false;
let previewCurrentIndex = 0;
let loopMode = false;

function getYoutubeId(url){
  if(!url) return "";

  if(url.includes("youtube.com/watch?v=")){
    return url.split("v=")[1].split("&")[0];
  }

  if(url.includes("youtu.be/")){
    return url.split("youtu.be/")[1].split("?")[0];
  }

  return url.trim();
}

function applyImageTransform(){
  $("coverImg").style.transform =
    `translate(${imgX}px, ${imgY}px) scale(${imgScale})`;
}

$("coverWrap").addEventListener("mousedown", e=>{
  if(!mainImageData) return;

  dragging = true;
  startX = e.clientX;
  startY = e.clientY;
  startImgX = imgX;
  startImgY = imgY;
});

window.addEventListener("mousemove", e=>{
  if(!dragging) return;

  imgX = startImgX + (e.clientX - startX);
  imgY = startImgY + (e.clientY - startY);

  applyImageTransform();
});

window.addEventListener("mouseup", ()=>{
  dragging = false;
});

$("imageScale").oninput = e=>{
  imgScale = parseFloat(e.target.value);
  applyImageTransform();
};

$("accentColor").oninput = e=>{
  document.documentElement.style.setProperty("--accent", e.target.value);
};

function resetImagePosition(){
  imgX = 0;
  imgY = 0;
  imgScale = 1;

  $("imageScale").value = 1;
  applyImageTransform();
}

function extractMainColor(imgSrc){
  const img = new Image();
  img.src = imgSrc;

  img.onload = () => {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = 40;
    canvas.height = 40;

    ctx.drawImage(img, 0, 0, 40, 40);

    const data = ctx.getImageData(0,0,40,40).data;

    let r = 0, g = 0, b = 0, count = 0;

    for(let i=0; i<data.length; i+=4){
      r += data[i];
      g += data[i+1];
      b += data[i+2];
      count++;
    }

    r = Math.floor(r / count);
    g = Math.floor(g / count);
    b = Math.floor(b / count);

    document.documentElement.style.setProperty(
      "--coverColor",
      `rgba(${r},${g},${b},.68)`
    );
  };
}

function toggleLoop(){
  loopMode = !loopMode;
  $("loopBtn").classList.toggle("active", loopMode);
}

function addSong(title="GAL", artist="OHAYO", youtube="", time="2:53"){
  songIndex++;

  const box = document.createElement("div");
  box.className = "song";

  box.innerHTML = `
    <label>노래 제목</label>
    <input class="song-title" value="${title}">

    <label>아티스트 / 캐릭터명</label>
    <input class="song-artist" value="${artist}">

    <label>유튜브 링크 또는 ID</label>
    <input class="song-youtube" value="${youtube}" placeholder="https://youtu.be/...">

    <label>재생시간</label>
    <input class="song-time" value="${time}">

    <button class="remove" onclick="this.parentElement.remove(); updatePreview();">삭제</button>
  `;

  $("songList").appendChild(box);

  box.querySelectorAll("input").forEach(input=>{
    input.oninput = updatePreview;
  });

  updatePreview();
}

$("homeTitle").oninput = updatePreview;
$("homeName").oninput = updatePreview;

$("mainImage").onchange = e => {
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    mainImageData = reader.result;
    $("coverImg").src = mainImageData;

    extractMainColor(mainImageData);
    resetImagePosition();
    updatePreview();
  };

  reader.readAsDataURL(file);
};

function collectSongs(){
  const boxes = document.querySelectorAll(".song");

  return [...boxes].map(box=>{
    return {
      title: box.querySelector(".song-title").value,
      artist: box.querySelector(".song-artist").value,
      youtube: getYoutubeId(box.querySelector(".song-youtube").value),
      time: box.querySelector(".song-time").value
    };
  }).filter(song=>song.title);
}

function previewLoadSong(song, index, autoPlay=false){
  if(!song) return;

  previewCurrentIndex = index;
  previewPlaying = false;
  $("previewPlayBtn").innerText = "▶";

  if(song.youtube){
    $("youtubeBox").innerHTML = `
      <iframe
        id="previewYt"
        width="1"
        height="1"
        src="https://www.youtube.com/embed/${song.youtube}?enablejsapi=1&origin=${location.origin}&loop=${loopMode ? 1 : 0}&playlist=${song.youtube}"
        allow="autoplay"
      ></iframe>
    `;
  }else{
    $("youtubeBox").innerHTML = "";
  }

  document.querySelectorAll(".preview-item").forEach((item, i)=>{
    item.classList.toggle("active", i === index);
  });

  if(autoPlay && song.youtube){
    setTimeout(()=>{
      const iframe = document.getElementById("previewYt");
      if(!iframe) return;

      iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
      $("previewPlayBtn").innerText = "Ⅱ";
      previewPlaying = true;
    },500);
  }
}

function previewToggleMusic(){
  const songs = collectSongs();

  if(!songs.length) return;

  let iframe = document.getElementById("previewYt");

  if(!iframe){
    previewLoadSong(songs[previewCurrentIndex] || songs[0], previewCurrentIndex || 0, true);
    return;
  }

  if(!previewPlaying){
    iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    $("previewPlayBtn").innerText = "Ⅱ";
    previewPlaying = true;
  }else{
    iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    $("previewPlayBtn").innerText = "▶";
    previewPlaying = false;
  }
}

function updatePreview(){
  $("previewTitle").innerText = $("homeTitle").value;
  $("previewName").innerText = $("homeName").value;

  const songs = collectSongs();

  $("songCountText").innerText = songs.length + "곡";
  $("previewSongs").innerHTML = "";

  songs.forEach((song, index)=>{
    const item = document.createElement("div");
    item.className = "preview-item" + (index === previewCurrentIndex ? " active" : "");

    item.onclick = () => {
      const shouldAutoPlay = previewPlaying;
      previewLoadSong(song, index, shouldAutoPlay);
    };

    item.innerHTML = `
      <div class="index">${index+1}</div>
      <div>
        <div class="preview-title">${song.title}</div>
        <div class="preview-artist">${song.artist}</div>
      </div>
      <div class="time">${song.time}</div>
    `;

    $("previewSongs").appendChild(item);
  });

  if(songs.length && !document.getElementById("previewYt")){
    previewLoadSong(songs[0],0,false);
  }
}

function makeHome(){
  const data = {
    title: $("homeTitle").value,
    maker: $("homeName").value,
    accentColor: $("accentColor").value,
    coverColor: getComputedStyle(document.documentElement).getPropertyValue("--coverColor"),
    mainImage: mainImageData,
    imagePosition:{
      x: imgX,
      y: imgY,
      scale: imgScale
    },
    loopMode: loopMode,
    songs: collectSongs().filter(song=>song.youtube)
  };

  localStorage.setItem("musicHomeData", JSON.stringify(data));

  const base = location.href
    .replace("index.html","")
    .replace("music-maker.html","");

  const url = base + "player.html";

  $("resultLink").value = url;
  window.open(url, "_blank");
}

addSong();
</script>

</body>
</html>
