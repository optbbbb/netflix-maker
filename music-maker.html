<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Spotify Character Maker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101010;
  color:white;
  font-family:Arial, sans-serif;
}

.wrap{
  min-height:100vh;
  display:grid;
  grid-template-columns:400px 1fr;
}

.panel{
  height:100vh;
  overflow:auto;
  padding:28px;
  background:#181818;
  border-right:1px solid #292929;
}

h1{
  margin:0 0 22px;
  font-size:27px;
}

small{
  display:block;
  color:#999;
  line-height:1.5;
  margin-bottom:22px;
}

label{
  display:block;
  margin-top:15px;
  color:#aaa;
  font-size:13px;
  font-weight:700;
}

input{
  width:100%;
  margin-top:7px;
  padding:12px;
  border:1px solid #444;
  border-radius:8px;
  background:#242424;
  color:white;
}

input[type="color"]{
  height:48px;
  padding:4px;
}

button{
  width:100%;
  margin-top:16px;
  padding:14px;
  border:0;
  border-radius:999px;
  font-weight:900;
  cursor:pointer;
}

.add{
  background:#333;
  color:white;
}

.make{
  background:var(--accent);
  color:black;
}

.remove{
  background:#672020;
  color:white;
  padding:10px;
}

.song{
  margin-top:18px;
  padding:16px;
  background:#202020;
  border:1px solid #333;
  border-radius:16px;
}

.result{
  margin-top:20px;
}

.preview{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
  background:#111;
}

.app{
  width:min(100%,520px);
  height:760px;
  background:#121212;
  overflow:hidden;
  border-radius:22px;
  box-shadow:0 25px 90px rgba(0,0,0,.65);
}

.album-head{
  padding:28px;
  background:linear-gradient(180deg,rgba(255,255,255,.18),#121212 82%);
}

.album-info{
  display:flex;
  align-items:flex-end;
  gap:20px;
}

.cover-wrap{
  width:150px;
  height:150px;
  background:#333;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  cursor:grab;
}

.cover-wrap:active{
  cursor:grabbing;
}

.cover-img{
  width:100%;
  height:100%;
  object-fit:cover;
  transform-origin:center;
  user-select:none;
  pointer-events:none;
}

.type{
  font-size:12px;
  font-weight:900;
  color:#eee;
}

.album-title{
  font-size:44px;
  font-weight:900;
  line-height:1;
  margin:8px 0;
  word-break:keep-all;
}

.album-meta{
  font-size:14px;
  color:#ddd;
  line-height:1.5;
}

.actions{
  display:flex;
  align-items:center;
  gap:18px;
  padding:18px 28px 6px;
}

.play-main{
  width:54px;
  height:54px;
  border-radius:50%;
  background:var(--accent);
  color:black;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:900;
}

.action-icon{
  color:#bbb;
  font-size:23px;
}

.song-table{
  padding:8px 28px 90px;
}

.table-head{
  display:grid;
  grid-template-columns:32px 1fr 52px;
  color:#999;
  font-size:13px;
  padding:10px 0;
  border-bottom:1px solid #2a2a2a;
}

.preview-item{
  display:grid;
  grid-template-columns:32px 1fr 52px;
  align-items:center;
  padding:12px 0;
  border-radius:8px;
}

.preview-item.active{
  background:#1f1f1f;
  margin:0 -8px;
  padding:12px 8px;
}

.index{
  color:#aaa;
}

.preview-title{
  font-size:15px;
  font-weight:800;
}

.preview-artist{
  margin-top:4px;
  color:#999;
  font-size:13px;
}

.time{
  color:#aaa;
  font-size:13px;
  text-align:right;
}

.mini-player{
  position:absolute;
  left:50%;
  bottom:28px;
  transform:translateX(-50%);
  width:min(460px,calc(100% - 64px));
  background:#242424;
  border:1px solid #333;
  border-radius:12px;
  padding:10px;
  display:grid;
  grid-template-columns:48px 1fr 42px;
  align-items:center;
  gap:10px;
}

.mini-thumb{
  width:48px;
  height:48px;
  background:#333;
  background-size:cover;
  background-position:center;
}

.mini-title{
  font-size:14px;
  font-weight:800;
}

.mini-artist{
  color:#aaa;
  font-size:12px;
  margin-top:4px;
}

.mini-play{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--accent);
  color:black;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.preview-shell{
  position:relative;
}

.youtube-box{
  width:0;
  height:0;
  overflow:hidden;
}

@media(max-width:900px){
  .wrap{
    grid-template-columns:1fr;
  }

  .panel{
    height:auto;
  }

  .preview{
    padding:20px;
  }
}

@media(max-width:560px){
  .app{
    width:100%;
    height:auto;
    min-height:100vh;
    border-radius:0;
  }

  .album-info{
    align-items:flex-start;
    flex-direction:column;
  }

  .cover-wrap{
    width:180px;
    height:180px;
  }

  .album-title{
    font-size:38px;
  }
}
</style>
</head>

<body style="--accent:#1DB954;">

<div class="wrap">
  <div class="panel">
    <h1>music home maker</h1>
    <small>캐릭터 이미지와 유튜브 링크를 넣어 스포티파이 느낌의 음악 홈피를 만듭니다.</small>

    <label>앨범 / 홈피 제목</label>
    <input id="homeTitle" value="내 현재 재생목록">

    <label>캐릭터 / 제작자 이름</label>
    <input id="homeName" value="OP T">

    <label>앨범 커버 이미지</label>
    <input type="file" id="mainImage" accept="image/*">

    <label>커버 확대</label>
    <input type="range" id="imageScale" min="1" max="2.5" step="0.01" value="1">

    <button class="add" onclick="resetImagePosition()">커버 위치 초기화</button>

    <label>재생 버튼 색상</label>
    <input type="color" id="accentColor" value="#1DB954">

    <div id="songList"></div>

    <button class="add" onclick="addSong()">+ 노래 추가</button>
    <button class="make" onclick="makeHome()">홈피 만들기</button>

    <label>완성 링크</label>
    <input class="result" id="resultLink" readonly>
  </div>

  <div class="preview">
    <div class="preview-shell">
      <div class="app">
        <div class="album-head">
          <div class="album-info">
            <div class="cover-wrap" id="coverWrap">
              <img class="cover-img" id="coverImg" draggable="false">
            </div>

            <div>
              <div class="type">앨범</div>
              <div class="album-title" id="previewTitle">내 현재 재생목록</div>
              <div class="album-meta">
                <b id="previewName">OP T</b> · 2025 ·
                <span id="songCountText">0곡</span>
              </div>
            </div>
          </div>
        </div>

        <div class="actions">
          <div class="play-main" id="previewPlayBtn" onclick="previewToggleMusic()">▶</div>
          <div class="action-icon">⇄</div>
          <div class="action-icon">＋</div>
          <div class="action-icon">↓</div>
          <div class="action-icon">⋯</div>
        </div>

        <div class="song-table">
          <div class="table-head">
            <div>#</div>
            <div>제목</div>
            <div>⏱</div>
          </div>

          <div id="previewSongs"></div>
        </div>
      </div>

      <div class="mini-player" id="miniPlayer" onclick="previewToggleMusic()">
        <div class="mini-thumb" id="miniThumb"></div>
        <div>
          <div class="mini-title" id="miniTitle">No Song</div>
          <div class="mini-artist" id="miniArtist">Choose music</div>
        </div>
        <div class="mini-play" id="miniPlay">▶</div>
      </div>
    </div>
  </div>
</div>

<div class="youtube-box" id="youtubeBox"></div>

<script>
const $ = id => document.getElementById(id);

let mainImageData = "";
let songIndex = 0;

let imgX = 0;
let imgY = 0;
let imgScale = 1;

let dragging = false;
let startX = 0;
let startY = 0;
let startImgX = 0;
let startImgY = 0;

let previewPlaying = false;
let previewCurrentIndex = 0;

function getYoutubeId(url){
  if(!url) return "";

  if(url.includes("youtube.com/watch?v=")){
    return url.split("v=")[1].split("&")[0];
  }

  if(url.includes("youtu.be/")){
    return url.split("youtu.be/")[1].split("?")[0];
  }

  return url.trim();
}

function applyImageTransform(){
  $("coverImg").style.transform =
    `translate(${imgX}px, ${imgY}px) scale(${imgScale})`;
}

$("coverWrap").addEventListener("mousedown", e=>{
  if(!mainImageData) return;

  dragging = true;
  startX = e.clientX;
  startY = e.clientY;
  startImgX = imgX;
  startImgY = imgY;
});

window.addEventListener("mousemove", e=>{
  if(!dragging) return;

  imgX = startImgX + (e.clientX - startX);
  imgY = startImgY + (e.clientY - startY);

  applyImageTransform();
});

window.addEventListener("mouseup", ()=>{
  dragging = false;
});

$("imageScale").oninput = e=>{
  imgScale = parseFloat(e.target.value);
  applyImageTransform();
};

$("accentColor").oninput = e=>{
  document.body.style.setProperty("--accent", e.target.value);
};

function resetImagePosition(){
  imgX = 0;
  imgY = 0;
  imgScale = 1;

  $("imageScale").value = 1;
  applyImageTransform();
}

function addSong(title="GAL", artist="OHAYO", youtube="", time="2:53"){
  songIndex++;

  const box = document.createElement("div");
  box.className = "song";

  box.innerHTML = `
    <label>노래 제목</label>
    <input class="song-title" value="${title}">

    <label>아티스트 / 캐릭터명</label>
    <input class="song-artist" value="${artist}">

    <label>유튜브 링크 또는 ID</label>
    <input class="song-youtube" value="${youtube}" placeholder="https://youtu.be/...">

    <label>재생시간</label>
    <input class="song-time" value="${time}">

    <button class="remove" onclick="this.parentElement.remove(); updatePreview();">삭제</button>
  `;

  $("songList").appendChild(box);

  box.querySelectorAll("input").forEach(input=>{
    input.oninput = updatePreview;
  });

  updatePreview();
}

$("homeTitle").oninput = updatePreview;
$("homeName").oninput = updatePreview;

$("mainImage").onchange = e => {
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    mainImageData = reader.result;
    $("coverImg").src = mainImageData;
    $("miniThumb").style.backgroundImage = `url(${mainImageData})`;
    resetImagePosition();
    updatePreview();
  };

  reader.readAsDataURL(file);
};

function collectSongs(){
  const boxes = document.querySelectorAll(".song");

  return [...boxes].map(box=>{
    return {
      title: box.querySelector(".song-title").value,
      artist: box.querySelector(".song-artist").value,
      youtube: getYoutubeId(box.querySelector(".song-youtube").value),
      time: box.querySelector(".song-time").value
    };
  }).filter(song=>song.title);
}

function previewLoadSong(song, index){
  if(!song) return;

  previewCurrentIndex = index;
  previewPlaying = false;

  $("previewPlayBtn").innerText = "▶";
  $("miniPlay").innerText = "▶";

  $("miniTitle").innerText = song.title || "No Song";
  $("miniArtist").innerText = song.artist || "";

  if(song.youtube){
    $("youtubeBox").innerHTML = `
      <iframe
        id="previewYt"
        width="1"
        height="1"
        src="https://www.youtube.com/embed/${song.youtube}?enablejsapi=1&origin=${location.origin}"
        allow="autoplay"
      ></iframe>
    `;
  }

  document.querySelectorAll(".preview-item").forEach((item, i)=>{
    item.classList.toggle("active", i === index);
  });
}

function previewToggleMusic(){
  const songs = collectSongs();

  if(!document.getElementById("previewYt")){
    if(songs.length){
      previewLoadSong(songs[previewCurrentIndex] || songs[0], previewCurrentIndex || 0);
    }
    return;
  }

  const iframe = document.getElementById("previewYt");

  if(!previewPlaying){
    iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    $("previewPlayBtn").innerText = "Ⅱ";
    $("miniPlay").innerText = "Ⅱ";
    previewPlaying = true;
  }else{
    iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    $("previewPlayBtn").innerText = "▶";
    $("miniPlay").innerText = "▶";
    previewPlaying = false;
  }
}

function updatePreview(){
  $("previewTitle").innerText = $("homeTitle").value;
  $("previewName").innerText = $("homeName").value;

  const songs = collectSongs();

  $("songCountText").innerText = songs.length + "곡";
  $("previewSongs").innerHTML = "";

  songs.forEach((song, index)=>{
    const item = document.createElement("div");
    item.className = "preview-item" + (index === previewCurrentIndex ? " active" : "");

    item.onclick = () => {
      previewLoadSong(song, index);
    };

    item.innerHTML = `
      <div class="index">${index+1}</div>
      <div>
        <div class="preview-title">${song.title}</div>
        <div class="preview-artist">${song.artist}</div>
      </div>
      <div class="time">${song.time}</div>
    `;

    $("previewSongs").appendChild(item);
  });

  if(songs.length && (!$("miniTitle").innerText || $("miniTitle").innerText === "No Song")){
    previewLoadSong(songs[0], 0);
  }
}

function makeHome(){
  const data = {
    title: $("homeTitle").value,
    maker: $("homeName").value,
    accentColor: $("accentColor").value,
    mainImage: mainImageData,
    imagePosition:{
      x: imgX,
      y: imgY,
      scale: imgScale
    },
    songs: collectSongs().filter(song=>song.youtube)
  };

  localStorage.setItem("musicHomeData", JSON.stringify(data));

  const base = location.href
    .replace("index.html","")
    .replace("music-maker.html","");

  const url = base + "player.html";

  $("resultLink").value = url;
  window.open(url, "_blank");
}

addSong();
</script>

</body>
</html>
