<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Music Home Player</title>

<style>
*{box-sizing:border-box}

:root{
  --accent:#1DB954;
}

body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
}

.app{
  width:min(100%,460px);
  min-height:100vh;
  background:#121212;
  overflow:hidden;
}

.album-head{
  padding:28px 26px 24px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.22),rgba(18,18,18,.96) 88%);
}

.album-info{
  display:flex;
  align-items:flex-end;
  gap:20px;
}

.cover-wrap{
  width:132px;
  height:132px;
  background:#333;
  flex-shrink:0;
  overflow:hidden;
  box-shadow:0 12px 35px rgba(0,0,0,.45);
}

.cover-img{
  width:100%;
  height:100%;
  object-fit:cover;
  transform-origin:center;
  user-select:none;
  pointer-events:none;
}

.type{
  font-size:12px;
  font-weight:900;
  color:#eee;
  margin-bottom:8px;
}

.album-title{
  font-size:42px;
  font-weight:900;
  line-height:.95;
  margin-bottom:10px;
  word-break:keep-all;
}

.album-meta{
  font-size:14px;
  color:#ddd;
  line-height:1.45;
}

.actions{
  display:flex;
  align-items:center;
  gap:22px;
  padding:18px 26px 8px;
}

.play-main{
  width:54px;
  height:54px;
  border-radius:50%;
  background:var(--accent);
  color:black;
  border:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:900;
  cursor:pointer;
}

.action-icon{
  color:#bbb;
  font-size:25px;
  cursor:pointer;
}

.action-icon:hover{
  color:white;
}

.list-mode{
  margin-left:auto;
  color:#aaa;
  font-size:14px;
  font-weight:800;
}

.song-table{
  padding:8px 26px 120px;
}

.table-head{
  display:grid;
  grid-template-columns:34px 1fr 54px;
  color:#999;
  font-size:13px;
  padding:10px 0;
  border-bottom:1px solid #2a2a2a;
}

.song-item{
  display:grid;
  grid-template-columns:34px 1fr 54px;
  align-items:center;
  padding:12px 0;
  border-radius:8px;
  cursor:pointer;
}

.song-item:hover{
  background:#1b1b1b;
  margin:0 -8px;
  padding:12px 8px;
}

.song-item.active{
  background:#242424;
  margin:0 -8px;
  padding:12px 8px;
}

.index{
  color:#aaa;
  font-size:15px;
}

.song-title{
  font-size:15px;
  font-weight:900;
}

.song-artist{
  margin-top:4px;
  color:#999;
  font-size:13px;
}

.time{
  color:#aaa;
  font-size:13px;
  text-align:right;
}

.mini-player{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  width:min(430px,calc(100% - 24px));
  background:#242424;
  border:1px solid #333;
  border-radius:12px;
  padding:10px;
  display:grid;
  grid-template-columns:48px 1fr 42px;
  align-items:center;
  gap:10px;
  z-index:20;
  box-shadow:0 12px 40px rgba(0,0,0,.45);
  cursor:pointer;
}

.mini-thumb{
  width:48px;
  height:48px;
  background:#333;
  background-size:cover;
  background-position:center;
}

.mini-title{
  font-size:14px;
  font-weight:900;
}

.mini-artist{
  color:#aaa;
  font-size:12px;
  margin-top:4px;
}

.mini-play{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--accent);
  color:black;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.full-player{
  position:fixed;
  inset:0;
  background:#121212;
  z-index:50;
  transform:translateY(100%);
  transition:.35s ease;
  display:flex;
  justify-content:center;
}

.full-player.open{
  transform:translateY(0);
}

.full-inner{
  width:min(100%,460px);
  padding:24px;
}

.close{
  font-size:28px;
  cursor:pointer;
  margin-bottom:24px;
}

.full-cover{
  width:100%;
  aspect-ratio:1/1;
  background:#333;
  background-size:cover;
  background-position:center;
  border-radius:10px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  margin-bottom:28px;
}

.full-title{
  font-size:28px;
  font-weight:900;
}

.full-artist{
  color:#aaa;
  font-size:17px;
  margin-top:8px;
}

.progress{
  margin:28px 0 18px;
}

.progress-line{
  height:5px;
  background:#444;
  border-radius:999px;
  overflow:hidden;
}

.progress-fill{
  width:22%;
  height:100%;
  background:white;
}

.progress-time{
  display:flex;
  justify-content:space-between;
  color:#aaa;
  font-size:13px;
  margin-top:8px;
}

.full-controls{
  display:flex;
  justify-content:space-around;
  align-items:center;
  font-size:30px;
  margin-top:20px;
}

.full-play{
  width:72px;
  height:72px;
  border-radius:50%;
  background:var(--accent);
  color:black;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:900;
  cursor:pointer;
}

.empty{
  color:#aaa;
  padding:30px 0;
  line-height:1.5;
}

.youtube-box{
  width:0;
  height:0;
  overflow:hidden;
}

@media(max-width:520px){
  .app{
    width:100%;
  }

  .album-info{
    align-items:flex-start;
    flex-direction:column;
  }

  .cover-wrap{
    width:148px;
    height:148px;
  }

  .album-title{
    font-size:38px;
  }
}
</style>
</head>

<body>

<div class="app">
  <div class="album-head">
    <div class="album-info">
      <div class="cover-wrap">
        <img class="cover-img" id="coverImg" draggable="false">
      </div>

      <div>
        <div class="type">앨범</div>
        <div class="album-title" id="albumTitle">EVOL</div>
        <div class="album-meta">
          <b id="artistName">Royal 44</b> · 2025 ·
          <span id="songCount">0곡</span>
        </div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="play-main" id="mainPlay" onclick="toggleMusic()">▶</button>
    <div class="action-icon" onclick="replaySong()">↻</div>
    <div class="action-icon">⋯</div>
    <div class="list-mode">목록 ☰</div>
  </div>

  <div class="song-table">
    <div class="table-head">
      <div>#</div>
      <div>제목</div>
      <div>⏱</div>
    </div>

    <div id="songList"></div>
  </div>
</div>

<div class="mini-player" id="miniPlayer" onclick="openFullPlayer()">
  <div class="mini-thumb" id="miniThumb"></div>
  <div>
    <div class="mini-title" id="miniTitle">No Song</div>
    <div class="mini-artist" id="miniArtist">Choose music</div>
  </div>
  <div class="mini-play" id="miniPlay" onclick="event.stopPropagation(); toggleMusic();">▶</div>
</div>

<div class="full-player" id="fullPlayer">
  <div class="full-inner">
    <div class="close" onclick="closeFullPlayer()">⌄</div>

    <div class="full-cover" id="fullCover"></div>

    <div class="full-title" id="fullTitle">No Song</div>
    <div class="full-artist" id="fullArtist">Choose music</div>

    <div class="progress">
      <div class="progress-line">
        <div class="progress-fill"></div>
      </div>
      <div class="progress-time">
        <span>0:31</span>
        <span id="fullDuration">2:53</span>
      </div>
    </div>

    <div class="full-controls">
      <div onclick="prevSong()">⏮</div>
      <div class="full-play" id="fullPlay" onclick="toggleMusic()">▶</div>
      <div onclick="nextSong()">⏭</div>
    </div>
  </div>
</div>

<div class="youtube-box" id="youtubeBox"></div>

<script>
const $ = id => document.getElementById(id);

let data = JSON.parse(localStorage.getItem("musicHomeData") || "{}");
let current = 0;
let isPlaying = false;

if(!data.songs){
  data = {
    title:"EVOL",
    maker:"Royal 44",
    accentColor:"#1DB954",
    mainImage:"",
    imagePosition:{x:0,y:0,scale:1},
    songs:[]
  };
}

document.documentElement.style.setProperty("--accent", data.accentColor || "#1DB954");

$("albumTitle").innerText = data.title || "EVOL";
$("artistName").innerText = data.maker || "Royal 44";
$("songCount").innerText = (data.songs || []).length + "곡";

function applyCover(){
  if(!data.mainImage) return;

  $("coverImg").src = data.mainImage;

  const pos = data.imagePosition || {x:0,y:0,scale:1};
  $("coverImg").style.transform =
    `translate(${pos.x || 0}px, ${pos.y || 0}px) scale(${pos.scale || 1})`;

  $("miniThumb").style.backgroundImage = `url(${data.mainImage})`;
  $("fullCover").style.backgroundImage = `url(${data.mainImage})`;
}

function renderSongs(){
  $("songList").innerHTML = "";

  if(!data.songs.length){
    $("songList").innerHTML = `
      <div class="empty">
        등록된 노래가 없습니다.<br>
        메이커에서 노래를 추가해주세요.
      </div>
    `;
    return;
  }

  data.songs.forEach((song,index)=>{
    const item = document.createElement("div");
    item.className = "song-item" + (index === current ? " active" : "");

    item.onclick = () => {
      const wasPlaying = isPlaying;
      loadSong(index, wasPlaying);
    };

    item.innerHTML = `
      <div class="index">${index + 1}</div>
      <div>
        <div class="song-title">${song.title}</div>
        <div class="song-artist">${song.artist}</div>
      </div>
      <div class="time">${song.time || "2:53"}</div>
    `;

    $("songList").appendChild(item);
  });
}

function loadSong(index, autoPlay=false){
  if(!data.songs.length) return;

  current = index;
  isPlaying = false;

  const song = data.songs[current];

  $("miniTitle").innerText = song.title || "No Song";
  $("miniArtist").innerText = song.artist || "";
  $("fullTitle").innerText = song.title || "No Song";
  $("fullArtist").innerText = song.artist || "";
  $("fullDuration").innerText = song.time || "2:53";

  $("mainPlay").innerText = "▶";
  $("miniPlay").innerText = "▶";
  $("fullPlay").innerText = "▶";

  $("youtubeBox").innerHTML = `
    <iframe
      id="yt"
      width="1"
      height="1"
      src="https://www.youtube.com/embed/${song.youtube}?enablejsapi=1&origin=${location.origin}"
      allow="autoplay"
    ></iframe>
  `;

  renderSongs();

  if(autoPlay){
    setTimeout(()=>{
      playMusic();
    },500);
  }
}

function playMusic(){
  const iframe = document.getElementById("yt");
  if(!iframe) return;

  iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');

  isPlaying = true;
  $("mainPlay").innerText = "Ⅱ";
  $("miniPlay").innerText = "Ⅱ";
  $("fullPlay").innerText = "Ⅱ";
}

function pauseMusic(){
  const iframe = document.getElementById("yt");
  if(!iframe) return;

  iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');

  isPlaying = false;
  $("mainPlay").innerText = "▶";
  $("miniPlay").innerText = "▶";
  $("fullPlay").innerText = "▶";
}

function toggleMusic(){
  if(!data.songs.length) return;

  if(!document.getElementById("yt")){
    loadSong(current, true);
    return;
  }

  if(isPlaying){
    pauseMusic();
  }else{
    playMusic();
  }
}

function replaySong(){
  if(!data.songs.length) return;
  loadSong(current, true);
}

function nextSong(){
  if(!data.songs.length) return;
  const next = (current + 1) % data.songs.length;
  loadSong(next, isPlaying);
}

function prevSong(){
  if(!data.songs.length) return;
  const prev = (current - 1 + data.songs.length) % data.songs.length;
  loadSong(prev, isPlaying);
}

function openFullPlayer(){
  $("fullPlayer").classList.add("open");
}

function closeFullPlayer(){
  $("fullPlayer").classList.remove("open");
}

applyCover();
renderSongs();

if(data.songs.length){
  loadSong(0,false);
}
</script>

</body>
</html>
